simblocks: 1
name: 3D-1 Spinning top
question: "A spinning disc on a pointed stem, tilted 20 degrees: does it fall over, and how fast does it precess?"
dim: 3d
gravity: 9.81

params:
  spin: {value: 196.95 rad/s, note: "spin about its own axis (about 1880 rpm)"}
  tilt: {value: 20 deg, note: "how far the stem leans from vertical"}
  precession: {value: 3.25 rad/s, note: "the steady precession rate (the equation in the note); 0 starts it with spin only"}
  stem: {value: 50 mm, note: "from the tip to the centre of the disc"}

derived:
  w_x: "= $spin * sin($tilt)"                 # start spin, world x part
  w_z: "= $spin * cos($tilt) + $precession"   # start spin, world z part: its own spin plus the precession

bodies:
  floor:
    ground: true
    points: {tip_rest: [0, 0, 0]}
    note: "the point the tip sits on"
  top:
    dof: free                   # slides and tumbles freely: only the joint holds the tip
    shape: {kind: disc, R: 40 mm, t: 8 mm, material: 1018_CD, at: [0, 0, $stem]}   # disc centre 50 mm up its own axis
    orient0: {axis: [0, 1, 0], angle: $tilt}   # tilted (its own z axis leans toward +x)
    omega0: [$w_x, 0, $w_z]       # spin about its tilted axis plus the steady precession (so it does not wobble)
    points: {tip: [0, 0, 0]}
    note: "the body's own frame: z along the stem, origin at the tip"

elements:
  pivot:
    type: pin
    rigid: true                 # a ball joint: the tip stays on its point, free to turn every way
    measure: [floor.tip_rest, top.tip]
    label: tip on the floor

outputs:
  quarter_turn_s: {body: top, quantity: x, reduce: first_time_below, value: 0, label: time for a quarter of a precession circle}
  lowest_z_mm:    {body: top, quantity: z, reduce: min, unit: mm, label: lowest the disc centre gets}
  tip_force_N:    {element: pivot, quantity: force, reduce: max, unit: N}

run:
  t_end: 1.2 s
  dt: 0.1 ms

editor:
  layout:
    b:floor:
    - 30
    - 170
    b:top:
    - 30
    - 530
    e:pivot:
    - 340
    - 30
    o:lowest_z_mm:
    - 340
    - 670
    o:quarter_turn_s:
    - 340
    - 410
    o:tip_force_N:
    - 650
    - 30
    p:precession:
    - -280
    - 330
    p:w_x:
    - -280
    - 480
    p:w_z:
    - -280
    - 690
    p:spin:
    - -280
    - 30
    p:stem:
    - 30
    - 390
    p:tilt:
    - -280
    - 180
  notes:
  - text: '**3D-1 Spinning top.** A steel disc on a stem, spinning fast and tilted 20 degrees, sits on a ball joint at its tip. Gravity tries to tip it over; because it spins, it swings round in a slow circle instead (precession). Textbook check: the simple gyroscope rule gives $\Omega \approx m g l / (I_s \omega_s) = 3.07$ rad/s. The full steady-precession equation $I_t \Omega^2 \cos\theta - I_s \omega_s \Omega + m g l = 0$ gives 3.25 rad/s, so a quarter circle takes $\pi / (2 \Omega) = 0.484$ s, and the disc does not fall.

      '
    x: -280
    y: -166
    width: 950
