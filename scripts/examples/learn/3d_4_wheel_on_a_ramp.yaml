simblocks: 1
name: 3D-4 Wheel on a ramp
question: "A 44 mm urethane wheel rolls down a 10 degree ramp from rest. How fast is it going after half a second, and does it slip?"
assumptions:
  - "The wheel is a solid disc (I = m r^2 / 2 about its axle). Rolling without slip: a = (2/3) g sin(10 deg) = 1.136 m/s^2 down the ramp, so 0.568 m/s after 0.5 s, and it needs mu of at least tan(10 deg) / 3 = 0.059."
dim: 3d
gravity: 9.81

params:
  k_tire: {value: 20 kN/m, note: "urethane tread contact stiffness"}
  mu_tire: {value: 1.67, note: "urethane on painted wood (sliding)"}

bodies:
  ramp:
    ground: true
    planes: {top: {at: [0, 0, 0], normal: [-0.17364818, 0, 0.98480775], size: [2 m, 0.5 m]}}
    note: "a 10 degree ramp, rising toward +x (the normal leans back toward -x)"
  wheel:
    dof: free
    mass: 25 g
    inertia: [3.49e-6, 6.05e-6, 3.49e-6]
    at: [-0.0038203, 0, 0.0216658]
    cylinders: {tread: {at: [0, 0, 0], axis: y, r: 22 mm, width: 15 mm}}
    note: "starts resting on the ramp at x = 0: its centre one radius out along the ramp's normal"

elements:
  tire: {type: kelvin_voigt, k: $k_tire, c: 15 N s/m, measure: {contact: [wheel.tread, ramp.top]}}
  grip: {type: contact_friction, contact: tire, mu: $mu_tire, v_eps: 0.001}

outputs:
  speed: {body: wheel, quantity: speed, reduce: final, unit: m/s}
  spin_rpm: {body: wheel, quantity: omega, reduce: final, unit: rpm}
  load_N: {element: tire, quantity: force, reduce: final, unit: N}

run: {t_end: 0.5 s, dt: 10 us}
