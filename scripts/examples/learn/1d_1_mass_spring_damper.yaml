simblocks: 1
name: 1D-1 Mass on a spring and damper
question: "How fast does a 1 kg mass on a spring ring down after it is pulled 10 mm and let go?"
dim: 1d

params:
  m: {value: 1 kg, note: "the moving mass"}
  k: {value: 400 N/m, note: "spring stiffness: natural frequency sqrt(k/m) = 20 rad/s (3.18 Hz)"}
  c: {value: 4 N s/m, note: "damper: damping ratio c / (2 sqrt(k m)) = 0.1"}
  x_start: {value: 10 mm, note: "how far it is pulled before it is let go"}

bodies:
  mass: {dof: translation, mass: $m, x0: $x_start, label: the mass, note: "one body, one coordinate: its position x"}

elements:
  spring:
    type: spring
    k: $k
    measure: mass                # the spring stretches by the mass's position (its other end is fixed)
    label: spring to the wall
    note: "force = k x, pulling the mass back to x = 0"
  damper:
    type: dashpot
    c: $c
    measure: mass                # same measure: it acts on the mass's speed
    label: damper to the wall
    note: "force = c v: dissipates the motion's energy"

outputs:
  first_trough_mm: {body: mass, quantity: position, reduce: min, unit: mm, label: deepest swing past zero}
  peak_spring_N:   {element: spring, quantity: force, reduce: max_abs, unit: N, label: largest spring force}
  dissipated_J:          {element: damper, quantity: dissipated, unit: J, label: energy the damper dissipated}
  x_end_mm:        {body: mass, quantity: position, unit: mm, label: position at the end}

run:
  t_end: 2 s

editor:
  layout:
    b:mass: [690, 40]
    e:damper: [960, 903]
    e:spring: [960, 488]
    o:dissipated_J: [1230, 240]
    o:first_trough_mm: [960, 40]
    o:peak_spring_N: [1230, 40]
    o:x_end_mm: [960, 264]
    p:c: [30, 330]
    p:k: [30, 170]
    p:m: [30, 30]
    p:x_start: [30, 490]
  groups:
    - name: inputs
      collapsed: true
      x: 30
      y: 190
      members: ['p:m', 'p:k', 'p:c', 'p:x_start']
      expose: {}
  notes:
    - text: "**1D-1 Mass on a spring and damper.** A mass is pulled 10 mm and let go. The spring pulls it back, it overshoots,\
        \ and the damper takes a little energy each swing until it settles. Textbook check: damped period $T_d = 2\\pi / (\\omega_n\
        \ \\sqrt{1-\\zeta^2}) = 0.316$ s, and the first swing past zero reaches $x_0 e^{-\\zeta \\omega_n T_d / 2} = 7.3$ mm.\
        \ Open **Help > Examples** for the full walk-through.\n"
      x: 30
      y: 30
      width: 640
