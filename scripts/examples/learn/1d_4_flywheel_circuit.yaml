simblocks: 1
name: 1D-4 Battery, ESCs and two motors spinning a flywheel
question: "How fast do two belt-driven motors on a 6S pack spin a flywheel up, how hard do they pull on the pack and the fuse, and how hot do the motors get?"
dim: 1d

params:
  kv: {value: 1100 rpm/V, note: "both motors"}
  belt: {value: 2, note: "each motor turns twice per flywheel turn"}
  I_esc: {value: 80 A, note: "each ESC's current limit"}

bodies:
  flywheel: {dof: rotation, inertia: 4e-3 kg m^2, label: flywheel}

elements:
  bearings: {type: friction, measure: flywheel, F_c: 0.08, v_eps: 1, label: bearing drag (N m)}

circuit:
  ground: gnd
  parts:
    pack: {type: battery, between: [bat, gnd], cells: 6, capacity: 1300 mAh, R0: 18 mohm, R1: 6 mohm, C1: 1500 farad, label: 6S 1300 mAh LiPo}
    fuse: {type: fuse, between: [bat, bus], I_rating: 120 A, t_blow: 2 s, label: main fuse}
    wiring: {type: resistor, between: [bus, esc], R: 4 mohm, label: leads and switch}
    caps: {type: capacitor, between: [esc, gnd], C: 1000 uF, ESR: 20 mohm, label: ESC input caps}
    m1:
      type: motor
      between: [esc, gnd]
      kv: $kv
      R: 32 mohm
      L: 10 uH
      gear: $belt
      measure: flywheel
      esc: {throttle: 1, I_max: $I_esc}
      thermal: {C_th: 45 J/K, R_th: 3 K/W, T_max_C: 150}
      label: left motor
    m2:
      type: motor
      between: [esc, gnd]
      kv: $kv
      R: 32 mohm
      L: 10 uH
      gear: $belt
      measure: flywheel
      esc: {throttle: 1, I_max: $I_esc}
      thermal: {C_th: 45 J/K, R_th: 3 K/W, T_max_C: 150}
      label: right motor

outputs:
  t_90_s:       {body: flywheel, quantity: velocity, reduce: first_time_above, value: 12000 rpm, label: time to 12000 rpm}
  rpm_end:      {body: flywheel, quantity: velocity, unit: rpm, label: flywheel speed at the end}
  I_pack_peak:  {part: pack, quantity: current, reduce: min, label: peak pack current (negative = discharging; the first microseconds charge the ESC caps)}
  V_bus_min:    {part: caps, quantity: voltage, reduce: min, label: lowest ESC input voltage}
  fuse_blown:   {part: fuse, quantity: state, reduce: final, label: fuse blown (1) or intact (0)}
  T_motor_max:  {part: m1, quantity: temperature, reduce: max, label: hottest motor temperature (C)}
  soc_end:      {part: pack, quantity: soc, reduce: final, label: pack charge left}
  E_heat_J:     {part: m1, quantity: heat, reduce: final, label: heat in one motor (J)}

run:
  t_end: 4 s

editor:
  layout:
    b:flywheel: [690, 140]
    c:caps: [1230, 140]
    c:fuse: [960, 740]
    c:m1: [1230, 680]
    c:m2: [1500, 140]
    c:pack: [960, 140]
    c:wiring: [960, 1200]
    e:bearings: [690, 440]
    n:bat: [1770, 360]
    n:bus: [1770, 520]
    n:esc: [1770, 680]
    n:gnd: [1770, 140]
    o:E_heat_J: [2040, 1512]
    o:I_pack_peak: [2040, 624]
    o:T_motor_max: [2040, 1184]
    o:V_bus_min: [2040, 820]
    o:fuse_blown: [2040, 1020]
    o:rpm_end: [2040, 400]
    o:soc_end: [2040, 1348]
    o:t_90_s: [2040, 140]
    p:I_esc: [30, 420]
    p:belt: [30, 280]
    p:kv: [30, 140]
  groups:
    - {name: inputs, collapsed: true, x: 30, y: 290, members: ['p:kv', 'p:belt', 'p:I_esc'], expose: {}}
  notes:
    - text: '**1D-4 Battery, ESCs and two motors.** The electrical side is drawn as a circuit: a pack, a fuse, the leads, the
        ESC capacitors and two motors behind current-limited ESCs, all wired between nets. Both motors drive the flywheel through
        a 2:1 belt. Textbook check: top speed $\approx kv \cdot V / \text{belt} = 1100 \times 25.2 / 2 \approx 13900$ rpm, a little
        less with sag and drag. While both ESCs hold 80 A the flywheel torque is $2 \cdot \text{belt} \cdot K_t I_{max} = 2.8$
        N m ($K_t = 1/kv$), about 690 rad/s gained every second. The peak pack current (about 540 A) is the inrush into the empty
        ESC capacitors in the first 50 microseconds: the spark you see when plugging in. Set the caps v0 to 25 V to see the motors
        alone (about 160 A). The motors carry a thermal model; tick thermal on any other part to see it heat.'
      x: 30
      y: 30
      width: 640
