  notes:
  - text: '**1D-5 Cruise control up a hill: control signals feeding back into the model.** The *push* node is a PID loop:
      it reads the car''s speed every step and sets the engine''s force so the speed holds 25 m/s. *drive* limits how fast
      the push can change, like a real throttle. *on_hill* is an if / else that latches on at 40 s and *slope* turns it
      into gravity''s pull down a 5 % grade. Check: on the hill the push must be drag + rolling + m g sin(slope) = 1,447
      N (*push_check*); the PID finds it by itself.'
    x: 30
    y: -140
    width: 860
