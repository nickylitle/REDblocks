simblocks: 1
name: 1D-5 Cruise control up a hill
question: "A PID loop holds a car at 25 m/s. When the road tips up a 5 % grade, how far does the speed sag and how hard does the engine push?"
dim: 1d
units: SI

params:
  m: {value: 1500 kg, note: "car and driver"}
  v_set: {value: 25, note: "cruise speed, m/s (90 km/h)"}
  grade: {value: 0.05, note: "the hill: 5 % (rise over run)"}
  t_hill: {value: 40 s, note: "when the hill starts"}
  F_max: {value: 5000, note: "most the engine can push at the wheels, N"}
  kp: {value: 900, note: "proportional gain, N per m/s"}
  ki: {value: 150, note: "integral gain, N per m"}

bodies:
  car: {dof: translation, mass: $m, v0: $v_set, label: car, note: already cruising at the set speed}
  road: {ground: true}

elements:
  air: {type: drag, measure: car - road, K: 0.42, label: air drag, note: "1/2 rho Cd A = 0.5 x 1.2 x 0.30 x 2.3 m^2"}
  tyres: {type: dashpot, measure: car - road, c: 18, label: rolling resistance (linearised)}
  engine: {type: force, measure: car - road, P: {control: drive, init: "= 0.42 * $v_set**2 + 18 * $v_set"}, label: engine at the wheels}
  hill: {type: force, measure: car - road, P: {control: slope}, label: gravity along the hill}

control:
  # the hill: gravity's pull back down the slope once the road tips up
  on_hill: {if: "t >= $t_hill", then: 1, else: 0, latch: true}
  slope: "= -$m * 9.81 * $grade / sqrt(1 + $grade**2) * on_hill"
  # the cruise controller: PID on speed, limited to what the engine can do, and smoothed like a real throttle
  # bias: the push that holds the set speed on the flat (drag + rolling), so it starts in balance
  push: {pid: {measure: car.velocity, setpoint: $v_set, kp: $kp, ki: $ki, kd: 0, min: 0, max: $F_max, bias: "= 0.42 * $v_set**2 + 18 * $v_set"}}
  drive: {rate_limit: push, rate: 2000}

outputs:
  v_sag: {body: car, quantity: velocity, reduce: min, label: slowest on the hill}
  v_end: {body: car, quantity: velocity, reduce: final, label: speed at the end}
  push_hill: {control: drive, reduce: final, unit: N, label: engine push on the hill}
  push_max: {control: drive, reduce: max, unit: N}
  t_sag: {body: car, quantity: velocity, reduce: time_of_min, label: when it is slowest}
  # checks: on the flat the push is drag + rolling = 712.5 N; on the hill add m g sin = 734.9 N: 1,447.4 N
  push_check: {expr: "= 0.42 * $v_set**2 + 18 * $v_set + $m * 9.81 * $grade / sqrt(1 + $grade**2)", unit: N}
  t_on_hill: {control: on_hill, reduce: first_time_above, value: 0.5, label: hill starts}

run:
  t_end: 90 s
  dt: 1 ms

