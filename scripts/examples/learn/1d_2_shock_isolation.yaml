simblocks: 1
name: 1D-2 Instrument on isolation mounts, hit by a shock pulse
question: "A 2 kN, 5 ms shock hits a 20 kg instrument on rubber mounts. How much force reaches the floor, and how far does it move?"
dim: 1d

params:
  m: {value: 20 kg, note: "the instrument"}
  k_mount: {value: 20 kN/m, note: "all four mounts together: natural frequency sqrt(k/m) = 31.6 rad/s (5 Hz)"}
  c_mount: {value: 120 N s/m, note: "rubber damping: about 10 % of critical"}

bodies:
  instrument: {dof: translation, mass: $m, label: instrument on its mounts}

elements:
  mounts:
    type: kelvin_voigt          # a spring and a damper side by side, one block
    k: $k_mount
    c: $c_mount
    measure: instrument         # stretch of the mounts = how far the instrument moves (the floor does not)
    label: rubber mounts
    note: "what the floor feels is this force"
  shock:
    type: force
    measure: instrument         # pushes the instrument along +x
    csv: {file: data/shock_pulse.csv, against: time, x_unit: ms, y_unit: kN, interpolation: smooth}
    label: shock pulse from the CSV
    note: "a table of force against time: 0 to 2 kN and back over 5 ms"

outputs:
  peak_shock_kN:   {element: shock, quantity: force, reduce: max_abs, unit: kN, label: largest shock force}
  peak_floor_N:    {element: mounts, quantity: force, reduce: max_abs, unit: N, label: largest force into the floor}
  peak_travel_mm:  {body: instrument, quantity: position, reduce: max, unit: mm, label: how far it moves}
  peak_speed:      {body: instrument, quantity: velocity, reduce: max, unit: m/s}
  dissipated_J:          {element: mounts, quantity: dissipated, unit: J, label: energy the rubber dissipated}

failure:
  - {name: mount travel, metric: peak_travel_mm, limit: 15, fails_when: above,
     origin: "example: the mounts bottom out at 15 mm of travel"}

run:
  t_end: 0.6 s

editor:
  layout:
    b:instrument:
    - 340
    - 30
    e:mounts:
    - 650
    - 1010
    e:shock:
    - 650
    - 250
    f:mount travel:
    - 960
    - 30
    o:dissipated_J:
    - 960
    - 670
    o:peak_floor_N:
    - 960
    - 470
    o:peak_shock_kN:
    - 960
    - 270
    o:peak_speed:
    - 650
    - 790
    o:peak_travel_mm:
    - 650
    - 30
    p:c_mount:
    - 30
    - 330
    p:k_mount:
    - 30
    - 170
    p:m:
    - 30
    - 30
  notes:
  - text: '**1D-2 Shock isolation.** A short shock (a CSV table of force against time) hits an instrument sitting on rubber mounts. The shock is over long before the mounts can push back, so the instrument just leaves with the impulse $J = \int F\,dt = 6.4$ N s and the mounts slow it down gently. Textbook check: speed $J/m = 0.32$ m/s, travel $\approx v/\omega_n = 10$ mm, floor force $\approx k x = 200$ N: a 2 kN hit reaches the floor as about 0.2 kN.

      '
    x: 30
    y: -166
    width: 640
