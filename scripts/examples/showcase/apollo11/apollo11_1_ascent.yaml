  notes:
  - text: '**Apollo 11, part 1: Saturn V to Earth orbit, checked against NASA''s flight data.** The engines come from their propellant chemistry
      (equilibrium combustion and nozzle expansion: the F-1 block predicts 304.8 s vacuum Isp, published 304 s). The flight is the physics: inverse-square
      gravity round a turning Earth, the US Standard Atmosphere for thrust and drag, mass burnt and stages dropped. From the flight report: the
      masses, the engines'' measured levels and the event times (staging, cutoffs). One number is tuned: the pitch-over rate just after the tower
      is cleared. The *checks_against_NASA* group reads the flight at NASA''s event times: S-IC staging 66.7 km / 95.1 km / 2,774 m/s; S-II staging
      1,623 km / 6,919 m/s; orbit 191.1 km, 7,793 m/s, cutoff at 699.3 s.'
