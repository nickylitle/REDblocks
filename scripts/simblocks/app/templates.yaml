# Starting points for New > template. One YAML document per template (separated by ---).
# Each is an ordinary system file: change the numbers, keep what fits, delete what doesn't.
simblocks: 1
name: Drop test
question: What peak force and deflection does the robot see when it lands flat from a height?
dim: 1d
units: mm
params:
  m: 1.36 kg                   # robot mass
  h: 1 m                       # drop height
  g: 9.81 m/s^2
  k_floor: 200 N/mm            # wheels + floor stiffness, ASSUMED
  e_floor: 0.3                 # coefficient of restitution, ASSUMED
derived:
  c_floor: {block: damping_for_restitution, e: $e_floor, k: $k_floor, m: $m}
  v_drop: "= sqrt(2 * $g * $h)"
bodies:                        # coordinate points DOWN; the floor is at chassis = 0
  chassis: {dof: translation, mass: $m, v0: $v_drop, label: Robot}
  floor: {ground: true}
elements:
  floor_contact: {type: kelvin_voigt, measure: chassis - floor, one_sided: true, k: $k_floor, c: $c_floor,
                  label: Wheels on floor}
  gravity: {type: force, measure: chassis, P: "= $m * $g"}
outputs:
  F_peak: {element: floor_contact, quantity: force, reduce: max, unit: N}
  defl_max: {element: floor_contact, quantity: measure, reduce: max, unit: mm}
  g_peak: {expr: "= $F_peak / ($m * $g)"}
run: {t_end: 40 ms}
---
simblocks: 1
name: Mass on a spring and damper
question: "How fast does a 1 kg mass on a spring ring down after it is pulled 10 mm and let go?"
dim: 1d

params:
  m: {value: 1 kg, note: "the moving mass"}
  k: {value: 400 N/m, note: "spring stiffness: natural frequency sqrt(k/m) = 20 rad/s (3.18 Hz)"}
  c: {value: 4 N s/m, note: "damper: damping ratio c / (2 sqrt(k m)) = 0.1"}
  x_start: {value: 10 mm, note: "how far it is pulled before it is let go"}

bodies:
  mass: {dof: translation, mass: $m, x0: $x_start, label: the mass, note: "one body, one coordinate: its position x"}

elements:
  spring:
    type: spring
    k: $k
    measure: mass                # the spring stretches by the mass's position (its other end is fixed)
    label: spring to the wall
    note: "force = k x, pulling the mass back to x = 0"
  damper:
    type: dashpot
    c: $c
    measure: mass                # same measure: it acts on the mass's speed
    label: damper to the wall
    note: "force = c v: turns motion into heat"

outputs:
  first_trough_mm: {body: mass, quantity: position, reduce: min, unit: mm, label: deepest swing past zero}
  peak_spring_N:   {element: spring, quantity: force, reduce: max_abs, unit: N, label: largest spring force}
  heat_J:          {element: damper, quantity: dissipated, unit: J, label: energy the damper turned to heat}
  x_end_mm:        {body: mass, quantity: position, unit: mm, label: position at the end}

run:
  t_end: 2 s
---
simblocks: 1
name: Motor, gearbox and flywheel spin-up
question: "How long does a 4-cell battery and a 1000 kV motor take to spin a 5 kg flywheel up through a 5:1 gearbox, and what current does it pull?"
dim: 1d

params:
  kv: {value: 1000 rpm/V, note: "motor speed constant"}
  gear: {value: 5, note: "motor turns 5 times per flywheel turn"}
  k_shaft: {value: 300 N m/rad, note: "twist stiffness of the shaft between gearbox and flywheel"}
  bearing_drag: {value: 0.05, note: "bearing friction torque, N m"}

bodies:
  rotor: {dof: rotation, inertia: 3e-5 kg m^2, label: motor rotor (motor side of the gearbox)}
  flywheel:
    dof: rotation
    shape: {kind: disc, R: 100 mm, t: 20 mm, material: 1018_CD}   # inertia m R^2 / 2 worked out from the shape
    label: steel flywheel

elements:
  motor:
    type: drive
    measure: rotor              # the motor turns the rotor
    kv: $kv
    R: 0.04 ohm
    I_max: 60 A
    cells: 4
    R0: 0.02 ohm
    capacity: 2200 mAh
    label: battery, ESC and motor
    note: "full throttle: the ESC limits current to 60 A, the battery sags under load"
  shaft:
    type: kelvin_voigt
    measure: "rotor / $gear - flywheel"   # twist of the output shaft: gearbox output angle minus flywheel angle
    k: $k_shaft
    c: 0.05
    label: gearbox output shaft
    note: "the 1 / gear coefficient is the gearbox: torque is multiplied by 5 on its way to the flywheel"
  bearings:
    type: friction
    measure: flywheel
    F_c: $bearing_drag
    v_eps: 0.5
    label: bearing drag

outputs:
  t_3000rpm_s:      {body: flywheel, quantity: velocity, reduce: first_time_above, value: 3000 rpm, label: time to reach 3000 rpm (90 % of top speed)}
  rpm_end:        {body: flywheel, quantity: velocity, unit: rpm, label: flywheel speed at the end}
  peak_current_A: {element: motor, quantity: current, reduce: max, label: peak motor current}
  min_voltage_V:  {element: motor, quantity: bus_voltage, reduce: min, label: lowest battery voltage}
  shaft_torque:   {element: shaft, quantity: force, reduce: max_abs, unit: N m, label: largest shaft torque}

run:
  t_end: 8 s
---
simblocks: 1
name: Bounce and roll (2D)
question: Where does a dropped wheel land, and does it roll or skid down the slope?
dim: 2d
units: mm
gravity: 9.81 m/s^2
params:
  m: 0.25 kg                   # wheel mass
  r: 30 mm                     # wheel radius
  drop: 150 mm                 # height of the drop above the slope
  mu: 0.7                      # tyre on floor friction, ASSUMED
  k_tyre: 40 N/mm              # tyre contact stiffness, ASSUMED
  c_tyre: 0.02 N s/mm          # tyre contact damping, ASSUMED
derived:
  I_w: "= 0.5 * $m * $r ** 2"  # solid disc
bodies:
  slope: {ground: true, lines: {floor: {from: [-200 mm, 60 mm], to: [600 mm, -150 mm], depth: 100 mm}}}
  wheel:
    mass: $m
    inertia: $I_w
    at: [0, $drop]
    circles: {tyre: {r: $r}}
    label: Wheel
elements:
  tyre: {type: kelvin_voigt, k: $k_tyre, c: $c_tyre, measure: {contact: [wheel.tyre, slope.floor]}, label: Tyre on floor}
  grip: {type: contact_friction, contact: tyre, mu: $mu, v_eps: 1 mm/s, label: Tyre grip}
outputs:
  F_land: {element: tyre, quantity: force, reduce: max, unit: N}
  x_end: {body: wheel, quantity: x, reduce: final, unit: mm}
  v_end: {body: wheel, quantity: speed, reduce: final, unit: m/s}
  spin_end: {body: wheel, quantity: omega, reduce: final, unit: rpm}
  slip: {expr: "= abs($v_end) - abs($spin_end) * 2 * pi / 60 * $r", label: "skid speed (0 = rolling)"}
run: {t_end: 0.6 s}
---
simblocks: 1
name: Pendulum on a hinge
question: "How long does a 0.5 m aluminium bar, let go at 30 degrees, take to swing down, and how hard does it pull on its hinge?"
dim: 2d
gravity: 9.81

params:
  L: {value: 500 mm, note: "bar length; the hinge is at its top end"}

bodies:
  wall:
    ground: true
    points: {pivot: [0, 0]}
    note: "the fixed world: carries the hinge point"
  bar:
    dof: planar
    shape: {kind: rod, L: $L, A: 200 mm^2, material: 6061-T6}   # 20 x 10 mm bar: mass and inertia from the shape
    at: [0.125000, -0.216506]          # its centre, with the bar tilted 30 degrees
    angle0: 30 deg
    points: {top: [0, 250 mm]}      # the hinge point, 250 mm above the centre in the bar's own frame
    note: "x, y and spin are all free: the hinge is what holds it"

elements:
  hinge:
    type: hinge
    rigid: true                 # an exact joint: the two points never separate, no stiffness to choose
    measure: [wall.pivot, bar.top]
    label: hinge at the top of the bar

outputs:
  quarter_period_s: {body: bar, quantity: angle, reduce: first_time_below, value: 0, label: time to reach the bottom}
  max_speed_rad_s:  {body: bar, quantity: omega, reduce: max_abs, unit: rad/s, label: fastest swing rate}
  hinge_force_N:    {element: hinge, quantity: force, reduce: max, unit: N, label: largest pull on the hinge}
  hinge_drift:      {element: hinge, quantity: drift, reduce: max, label: largest gap the joint had to close (m)}

run:
  t_end: 2.5 s
  dt: 0.2 ms
---
simblocks: 1
name: Spinning top
question: "A spinning disc on a pointed stem, tilted 20 degrees: does it fall over, and how fast does it precess?"
dim: 3d
gravity: 9.81

params:
  spin: {value: 200 rad/s, note: "spin about its own axis (about 1900 rpm)"}
  l: {value: 50 mm, note: "from the tip to the centre of the disc"}

bodies:
  floor:
    ground: true
    points: {tip_rest: [0, 0, 0]}
    note: "the point the tip sits on"
  top:
    dof: free                   # slides and tumbles freely: only the joint holds the tip
    shape: {kind: disc, R: 40 mm, t: 8 mm, material: 1018_CD, at: [0, 0, $l]}   # disc centre 50 mm up its own axis
    orient0: {axis: [0, 1, 0], angle: 20 deg}   # tilted 20 degrees (its own z axis leans toward +x)
    omega0: [67.360997, 0, 188.318157]   # spin about its tilted axis plus the steady precession (so it does not wobble)
    points: {tip: [0, 0, 0]}
    note: "the body's own frame: z along the stem, origin at the tip"

elements:
  pivot:
    type: pin
    rigid: true                 # a ball joint: the tip stays on its point, free to turn every way
    measure: [floor.tip_rest, top.tip]
    label: tip on the floor

outputs:
  quarter_turn_s: {body: top, quantity: x, reduce: first_time_below, value: 0, label: time for a quarter of a precession circle}
  lowest_z_mm:    {body: top, quantity: z, reduce: min, unit: mm, label: lowest the disc centre gets}
  tip_force_N:    {element: pivot, quantity: force, reduce: max, unit: N}

run:
  t_end: 1.2 s
  dt: 0.1 ms
---
simblocks: 1
name: Drone arm under a thrust punch
question: "A 200 mm carbon tube arm carries a motor. Hover, then full throttle: how far does the tip bend and what moment reaches the hub?"
dim: 3d
gravity: 9.81

params:
  L_arm: {value: 200 mm, note: "hub centre to motor centre"}
  do: {value: 12 mm, note: "tube outside diameter"}
  di: {value: 10 mm, note: "tube inside diameter"}

derived:
  tube: {block: tube, do: $do, di: $di}       # section properties (A, I, J, Z) of the round tube

bodies:
  hub:
    ground: true                # the frame is held still: we look at one arm
    points: {root: [0, 0, 0]}
  motor:
    dof: free
    shape: {kind: cylinder, R: 14 mm, L: 20 mm, mass: 60 g}   # a 60 g motor; its axis is z
    at: [$L_arm, 0, 0]
    points: {mount: [0, 0, 0]}

elements:
  arm:
    type: beam                  # stretches, bends both ways and twists; 6 pieces so it can vibrate
    measure: [hub.root, motor.mount]
    section: $tube
    E: 70 GPa                   # pultruded carbon tube along its length
    G: 5 GPa
    density: 1550 kg/m^3
    segments: 6
    damping: 0.02
    orient: z
    label: carbon tube arm
  thrust:
    type: force
    measure: motor.z            # pushes the motor up
    P: 8 N                      # constant thrust (a CSV table can replace it)
    label: propeller thrust from a CSV

outputs:
  tip_up_mm:      {body: motor, quantity: z, reduce: max, unit: mm, label: highest the tip goes}
  tip_down_mm:    {body: motor, quantity: z, reduce: min, unit: mm, label: lowest the tip goes}
  root_moment:    {element: arm, quantity: moment, reduce: max, unit: N m, label: largest bending moment in the arm}
  peak_thrust_N:  {element: thrust, quantity: force, reduce: max_abs, unit: N}

failure:
  - {name: tube bending, metric: root_moment, limit: 10, fails_when: above,
     origin: "example: 12/10 mm tube, about 600 MPa allowable times Z = 0.1 cm^3 gives 10 N m (check your supplier's data)"}

run:
  t_end: 1.4 s
