# Starting points for New > template. One YAML document per template (separated by ---).
# Each is an ordinary system file: change the numbers, keep what fits, delete what doesn't.
simblocks: 1
name: Spinner hit
question: How hard does a spinning blade hit an opponent, and how much speed does the blade lose?
dim: 1d
units: mm
params:
  I_blade: 3.0e-3 kg m^2       # weapon inertia about its spin axis (CAD mass properties)
  rpm0: 9000 rpm               # speed at impact
  R_tip: 75 mm                 # radius of the tooth that hits
  m_opp: 1.36 kg               # opponent mass
  k_hit: 5 kN/mm               # contact stiffness (tooth + armour), ASSUMED
  e_hit: 0.2                   # coefficient of restitution of the hit, ASSUMED
derived:
  m_eff: "= 1 / (1 / $m_opp + $R_tip ** 2 / $I_blade)"   # mass the tooth feels
  c_hit: {block: damping_for_restitution, e: $e_hit, k: $k_hit, m: $m_eff}
bodies:
  blade: {dof: rotation, inertia: $I_blade, v0: $rpm0, label: Weapon}
  opponent: {dof: translation, mass: $m_opp, label: Opponent}
elements:
  hit: {type: kelvin_voigt, measure: $R_tip * blade - opponent, one_sided: true, k: $k_hit, c: $c_hit,
        label: Tooth on opponent}
outputs:
  F_peak: {element: hit, quantity: force, reduce: max, unit: N}
  rpm_after: {body: blade, quantity: velocity, reduce: final, unit: rpm}
  v_opp: {body: opponent, quantity: velocity, reduce: final, unit: m/s}
exports:
  - name: hit_force
    columns: [{element: hit, quantity: force, unit: N, label: F_hit}]
    folder: out/csv
    naming: "{model}_{name}"
    time_unit: ms
    points: 1000
    header: units
    when: run
run: {t_end: 2 ms}
---
simblocks: 1
name: Drop test
question: What peak force and deflection does the robot see when it lands flat from a height?
dim: 1d
units: mm
params:
  m: 1.36 kg                   # robot mass
  h: 1 m                       # drop height
  g: 9.81 m/s^2
  k_floor: 200 N/mm            # wheels + floor stiffness, ASSUMED
  e_floor: 0.3                 # coefficient of restitution, ASSUMED
derived:
  c_floor: {block: damping_for_restitution, e: $e_floor, k: $k_floor, m: $m}
  v_drop: "= sqrt(2 * $g * $h)"
bodies:                        # coordinate points DOWN; the floor is at chassis = 0
  chassis: {dof: translation, mass: $m, v0: $v_drop, label: Robot}
  floor: {ground: true}
elements:
  floor_contact: {type: kelvin_voigt, measure: chassis - floor, one_sided: true, k: $k_floor, c: $c_floor,
                  label: Wheels on floor}
  gravity: {type: force, measure: chassis, P: "= $m * $g"}
outputs:
  F_peak: {element: floor_contact, quantity: force, reduce: max, unit: N}
  defl_max: {element: floor_contact, quantity: measure, reduce: max, unit: mm}
  g_peak: {expr: "= $F_peak / ($m * $g)"}
run: {t_end: 40 ms}
---
simblocks: 1
name: Weapon spin-up and battery
question: How long does the weapon take to spin up, and how far does the pack sag?
dim: 1d
units: mm
params:
  I_w: 1.2e-3 kg m^2           # weapon inertia
  kv: 1350 rpm/V
  R_m: 40 mohm                 # winding resistance
  I_max: 60 A                  # ESC current limit
  G: 1.0                       # motor turns per weapon turn
  J_rot: 2.0e-6 kg m^2         # motor rotor inertia
  cells: 6
  R0: 0.12 ohm                 # pack resistance (about 20 mohm per cell), ASSUMED
  R1: 0.04 ohm
  C1: 600 farad
  Q: 650 mAh
  K_air: 2.0e-8 N m s^2        # windage, torque = K w^2, ASSUMED
  T_brg: 0.01 N m              # bearing drag
  target: 9000 rpm
bodies:
  weapon: {dof: rotation, inertia: $I_w, label: Weapon}
elements:
  motor: {type: drive, measure: weapon, kv: $kv, R: $R_m, I_max: $I_max, gear: $G, J_rotor: $J_rot,
          cells: $cells, R0: $R0, R1: $R1, C1: $C1, capacity: $Q, label: Motor + ESC + pack}
  windage: {type: drag, measure: weapon, K: $K_air}
  bearing: {type: friction, measure: weapon, F_c: $T_brg, v_eps: 1 rad/s}
outputs:
  t_spin: {body: weapon, quantity: velocity, reduce: first_time_above, value: $target, unit: s}
  rpm_final: {body: weapon, quantity: velocity, reduce: final, unit: rpm}
  v_bus_min: {element: motor, quantity: bus_voltage, reduce: min, unit: V}
  I_peak: {element: motor, quantity: current, reduce: max, unit: A}
  soc_final: {element: motor, quantity: soc, reduce: final}
  v_min_cell: {expr: "= $v_bus_min / $cells"}
run: {t_end: 4 s}
---
simblocks: 1
name: Drive push
question: How fast does the robot push an opponent, and what current does the drive draw?
dim: 1d
units: mm
params:
  m_bot: 1.36 kg
  m_opp: 1.36 kg
  r_wheel: 25 mm
  J_wheel: 2.0e-5 kg m^2       # wheel + gearbox reflected inertia
  kv: 2000 rpm/V               # drive motor (both sides lumped)
  R_m: 0.15 ohm
  I_max: 30 A
  G: 20                        # gearbox: motor turns per wheel turn
  cells: 6
  R0: 0.12 ohm
  Q: 650 mAh
  mu_wheel: 1.0                # tyre grip on the floor, ASSUMED
  mu_opp: 0.4                  # opponent sliding friction, ASSUMED
  g: 9.81 m/s^2
  k_bump: 50 N/mm              # front contact stiffness, ASSUMED
bodies:
  wheel: {dof: rotation, inertia: $J_wheel, label: Wheels (lumped)}
  bot: {dof: translation, mass: $m_bot, label: Robot}
  opp: {dof: translation, mass: $m_opp, label: Opponent}
elements:
  motor: {type: drive, measure: wheel, kv: $kv, R: $R_m, I_max: $I_max, gear: $G, cells: $cells, R0: $R0,
          capacity: $Q, label: Drive motors + ESC + pack}
  traction: {type: friction, measure: $r_wheel * wheel - bot, F_c: "= $mu_wheel * $m_bot * $g", v_eps: 0.01 m/s,
             label: Tyre grip (slips past this)}
  bumper: {type: spring, measure: bot - opp, k: $k_bump, label: Robot on opponent}
  opp_floor: {type: friction, measure: opp, F_c: "= $mu_opp * $m_opp * $g", v_eps: 0.01 m/s, label: Opponent sliding}
outputs:
  v_push: {body: opp, quantity: velocity, reduce: final, unit: m/s}
  pushed: {body: opp, quantity: position, reduce: final, unit: mm}
  I_peak: {element: motor, quantity: current, reduce: max, unit: A}
  I_batt_peak: {element: motor, quantity: battery_current, reduce: max, unit: A}
run: {t_end: 1 s}
---
simblocks: 1
name: Vertical spinner on a wedge (2D)
question: How far does a 600 J vertical spinner bend a 60 degree wedge face, by contact angle?
dim: 2d
units: SI
params:
  hit: {value: 120 deg, note: "contact angle theta0 + alpha (tooth angle below horizontal plus face angle); 90 = pure glance"}
  alpha: {value: 60 deg, note: wedge face angle from horizontal}
  L: {value: 30 mm, note: face length root to lip}
  t: {value: 2 mm, note: sheet thickness}
  from_lip: {value: 3 mm, note: where along the face the tooth first lands}
  R: {value: 90 mm, note: tooth radius}
  I_w: {value: 7.56e-4 kg m^2, note: weapon inertia (597 J at 1257 rad/s)}
  w0: {value: 1257 rad/s, note: weapon speed (113 m/s tip)}
  I_face: {value: 1.35e-5 kg m^2, note: face inertia about its root (0.015 L^2 kg m^2 per m of L, as the 1d model)}
  bend: {block: plate_root_hinge, material: 4130_45HRC, width: 60 mm, t: $t, L: $L, rate_factor: 1.2}
  gouge: {block: plastic_indentation_table, R: 1.5 mm, Y: 1710 MPa, Estar: 115 GPa}
  fold: {value: 30 deg, note: face rotation at which it lands on the chassis (60 deg face -> vertical)}
  mu: {value: 0.2, note: tooth-on-face sliding friction (steel on steel, lubricated by chips)}
  bite: {value: 4 mm, note: deepest the tooth can bite (its protrusion) before it tears through and loses purchase}
derived:
  th0: = $hit - $alpha
  tx: = $R*cos($th0)
  ty: = -$R*sin($th0)
  cx: = $tx + 0.00005*sin($alpha)
  cy: = $ty - 0.00005*cos($alpha)
  rootx: = $cx + ($L - $from_lip)*cos($alpha)
  rooty: = $cy + ($L - $from_lip)*sin($alpha)
  lipx: = -$L*cos($alpha)
  lipy: = -$L*sin($alpha)
bodies:
  weapon:
    dof: [rz]
    inertia: $I_w
    omega0: $w0
    points: {tooth: [$R, 0]}
    angle0: = -$th0
    label: Weapon (vertical spinner)
  face:
    dof: [rz]
    inertia: $I_face
    at: [$rootx, $rooty]
    lines: {front: {from: [$lipx, $lipy], to: [0, 0], depth: $bite}}
    label: Wedge face (turns about its root)
elements:
  gouge:
    type: elastoplastic
    table: $gouge
    measure: {contact: [weapon.tooth, face.front]}
    label: Tooth gouge
  bend:
    type: elastoplastic
    table: $bend
    measure: face.rz
    label: Root bend hinge
  backstop:
    type: kelvin_voigt
    one_sided: true
    k: 2e5 N m/rad
    c: 5 N m s/rad
    measure: face.rz - $fold
    label: Chassis backstop
  slide:
    type: contact_friction
    contact: gouge
    mu: $mu
    v_eps: 0.05 m/s
    label: Tooth sliding on the face
outputs:
  bend_set: {element: bend, quantity: plastic_set, reduce: max_abs, unit: deg, label: Permanent bend}
  bend_rad: {element: bend, quantity: plastic_set, reduce: max_abs}
  gouge_set: {element: gouge, quantity: plastic_set, reduce: max, unit: mm, label: Gouge depth}
  F_peak: {element: gouge, quantity: force, reduce: max, unit: N, label: Peak contact force}
  w_end: {body: weapon, quantity: omega}
  E_lost: {expr: "0.5*$I_w*($w0**2 - $w_end**2)", label: Weapon energy lost (J)}
  W_bend: {element: bend, quantity: absorbed_work, label: Work into the bend (J)}
  W_gouge: {element: gouge, quantity: absorbed_work, label: Work into the gouge (J)}
  face_rot: {body: face, quantity: angle, reduce: max, unit: deg, label: Peak face rotation}
  tip_drop_mm: {expr: "1000*$L*(sin($alpha + $bend_rad) - sin($alpha))", label: Permanent lip drop (mm)}
uncertain:
  hit: [95 deg, 130 deg]
  mu: [0.1, 0.4]
failure:
  - {name: tip drop, metric: tip_drop_mm, limit: 5, fails_when: above, origin: "Nicky: the wedge fails at a permanent 5 mm tip drop"}
run:
  t_end: 0.4 ms
  dt: 20 ns
---
simblocks: 1
name: Bounce and roll (2D)
question: Where does a dropped wheel land, and does it roll or skid down the slope?
dim: 2d
units: mm
gravity: 9.81 m/s^2
params:
  m: 0.25 kg                   # wheel mass
  r: 30 mm                     # wheel radius
  drop: 150 mm                 # height of the drop above the slope
  mu: 0.7                      # tyre on floor friction, ASSUMED
  k_tyre: 40 N/mm              # tyre contact stiffness, ASSUMED
  c_tyre: 0.02 N s/mm          # tyre contact damping, ASSUMED
derived:
  I_w: "= 0.5 * $m * $r ** 2"  # solid disc
bodies:
  slope: {ground: true, lines: {floor: {from: [-200 mm, 60 mm], to: [600 mm, -150 mm], depth: 100 mm}}}
  wheel:
    mass: $m
    inertia: $I_w
    at: [0, $drop]
    circles: {tyre: {r: $r}}
    label: Wheel
elements:
  tyre: {type: kelvin_voigt, k: $k_tyre, c: $c_tyre, measure: {contact: [wheel.tyre, slope.floor]}, label: Tyre on floor}
  grip: {type: contact_friction, contact: tyre, mu: $mu, v_eps: 1 mm/s, label: Tyre grip}
outputs:
  F_land: {element: tyre, quantity: force, reduce: max, unit: N}
  x_end: {body: wheel, quantity: x, reduce: final, unit: mm}
  v_end: {body: wheel, quantity: speed, reduce: final, unit: m/s}
  spin_end: {body: wheel, quantity: omega, reduce: final, unit: rpm}
  slip: {expr: "= abs($v_end) - abs($spin_end) * 2 * pi / 60 * $r", label: "skid speed (0 = rolling)"}
run: {t_end: 0.6 s}
---
simblocks: 1
name: Horizontal spinner on a wedge (3D)
question: How far does a 600 J horizontal spinner bend a 60 degree wedge face, where the tooth meets it?
dim: 3d
units: SI
params:
  phi0: {value: -30 deg, note: tooth angle at first touch (0 = pointing straight at the wedge; negative = before)}
  z_tooth: {value: 12 mm, note: tooth height above the floor; sets where on the face it lands}
  alpha: {value: 60 deg, note: wedge face angle from horizontal}
  L: {value: 30 mm, note: face length root to lip}
  width: {value: 60 mm, note: face width (the 45 degree dispersion width 2 L, as the 1d model)}
  t: {value: 2 mm, note: sheet thickness}
  z_lip: {value: 2 mm, note: lip height above the floor}
  R: {value: 90 mm, note: tooth radius}
  I_w: {value: 7.56e-4 kg m^2, note: weapon inertia (597 J at 1257 rad/s)}
  w0: {value: 1257 rad/s, note: weapon speed (113 m/s tip)}
  I_face: {value: 1.35e-5 kg m^2, note: face inertia about its root hinge}
  bend: {block: plate_root_hinge, material: 4130_45HRC, width: $width, t: $t, L: $L, rate_factor: 1.2}
  gouge: {block: plastic_indentation_table, R: 1.5 mm, Y: 1710 MPa, Estar: 115 GPa}
  fold: {value: 30 deg, note: extra face rotation at which it lands on the chassis}
  mu: {value: 0.2, note: tooth-on-face friction}
  bite: {value: 4 mm, note: deepest the tooth can bite before it tears through}
derived:
  s_hit: = ($z_tooth - $z_lip) / sin($alpha)
  xc: = $R*cos($phi0) + 0.00005
  yc: = $R*sin($phi0)
  x_lip: = $xc - $s_hit*cos($alpha)
  x_root: = $x_lip + $L*cos($alpha)
  z_root: = $z_lip + $L*sin($alpha)
  mid_x: = -0.5*$L*cos($alpha)
  mid_z: = -0.5*$L*sin($alpha)
  nx: = -sin($alpha)
  nz: = cos($alpha)
  ux: = cos($alpha)
  uz: = sin($alpha)
bodies:
  weapon:
    dof: [spin]
    axis: z
    inertia: $I_w
    omega0: $w0
    angle0: $phi0
    points: {tooth: [$R, 0, $z_tooth]}
    label: Weapon (horizontal spinner)
  face:
    dof: [spin]
    axis: y
    inertia: $I_face
    at: [$x_root, $yc, $z_root]
    planes: {front: {at: [$mid_x, 0, $mid_z], normal: [$nx, 0, $nz], u: [$ux, 0, $uz], size: [$L, $width], depth: $bite}}
    label: Wedge face (turns about its root)
elements:
  gouge: {type: elastoplastic, table: $gouge, measure: {contact: [weapon.tooth, face.front]}, label: Tooth gouge}
  bend: {type: elastoplastic, table: $bend, measure: face.spin, label: Root bend hinge}
  backstop: {type: kelvin_voigt, one_sided: true, k: 2e5 N m/rad, c: 5 N m s/rad, measure: -face.spin - $fold,
             label: Chassis backstop}
  slide: {type: contact_friction, contact: gouge, mu: $mu, v_eps: 0.05 m/s, label: Tooth sliding on the face}
outputs:
  bend_set: {element: bend, quantity: plastic_set, reduce: max_abs, unit: deg, label: Permanent bend}
  bend_rad: {element: bend, quantity: plastic_set, reduce: max_abs}
  gouge_set: {element: gouge, quantity: plastic_set, reduce: max, unit: mm, label: Gouge depth}
  F_peak: {element: gouge, quantity: force, reduce: max, unit: N, label: Peak contact force}
  w_end: {body: weapon, quantity: omega}
  face_rot: {body: face, quantity: angle, reduce: max_abs, unit: deg, label: Peak face rotation}
  W_bend: {element: bend, quantity: absorbed_work, label: Work into the bend (J)}
  W_gouge: {element: gouge, quantity: absorbed_work, label: Work into the gouge (J)}
  E_lost: {expr: "0.5*$I_w*($w0**2 - $w_end**2)", label: Weapon energy lost (J)}
  tip_drop_mm: {expr: "1000*$L*(sin($alpha + $bend_rad) - sin($alpha))", label: Permanent lip drop (mm)}
uncertain:
  phi0: [-35 deg, -5 deg]
  z_tooth: [6 mm, 20 mm]
failure:
  - {name: tip drop, metric: tip_drop_mm, limit: 5, fails_when: above, origin: "Nicky: the wedge fails at a permanent 5 mm tip drop"}
run:
  t_end: 0.4 ms
  dt: 20 ns
