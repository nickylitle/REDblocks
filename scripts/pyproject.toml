[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simblocks"
version = "0.9.0"
description = "Tested building blocks, a system-file compiler and a verification harness for explicit dynamics sims"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.58", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
app = ["pywebview>=5.0"]

[project.scripts]
simblocks = "simblocks.cli:main"
simblocks-runner = "simblocks.runner_app:main"
simblocks-app = "simblocks.app.main:main"

[tool.setuptools.packages.find]
include = ["simblocks*"]

[tool.setuptools.package-data]
simblocks = ["viz/fonts/*", "materials/*.json", "materials/curves/user/*",
             "materials/cards/*", "materials/research/*.json", "app/editor.html", "app/examples/*.yaml", "app/examples/data/*", "app/fonts/*",
             "app/templates.yaml", "app/katex_bundle.js", "app/block_sources.json"]
